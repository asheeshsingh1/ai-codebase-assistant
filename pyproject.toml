[project]
name = "ai-codebase-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Asheesh Singh",email = "asheeshsingh0112@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.140.7,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "gitpython (>=3.1.57,<4.0.0)",
    "google-genai (>=2.14.0,<3.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "greenlet (>=3.5.4,<4.0.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
black = "^26.5.1"
isort = "^8.0.1"
ruff = "^0.16.0"